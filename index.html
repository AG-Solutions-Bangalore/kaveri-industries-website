<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Space Grotesk — display font for all headings. `preconnect` to
         both the CSS and font-file origins warms the TLS handshake so
         the first paint isn't blocked waiting on DNS / TCP / TLS.
         The variable-axis range 300..700 covers the full weight range
         the design uses (light, regular, medium, semibold, bold). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap"
    />

    <!-- LCP image preload — warms the hero banner image immediately for faster LCP.
         NOTE: image base URL lives in ONE place: src/lib/images.ts (IMAGE_BASE_URL).
         index.html can't import TS, so if the domain changes, update the 3 hardcoded
         URLs below (preload + og:image + twitter:image) to match. -->
    <link
      rel="preload"
      as="image"
      href="https://agsdemo.in/kaveri/api/assets/images/home/home_banner_image.webp"
      fetchpriority="high"
    />

    <title>High Tensile MS Fasteners Manufacturer | Kaveri Industries</title>
    <meta
      name="description"
      content="Kaveri Industries manufactures high tensile MS fasteners, bolts, nuts, U-bolts and washers for towers, infrastructure, power, railways and industrial applications."
    />
    <link rel="canonical" href="https://kaveri.agsdemo.in/" />
    <meta name="author" content="Kaveri Industries" />
    <meta name="publisher" content="Kaveri Industries" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaveri Industries" />
    <meta property="og:title" content="High Tensile MS Fasteners Manufacturer | Kaveri Industries" />
    <meta
      property="og:description"
      content="Kaveri Industries manufactures high tensile MS fasteners, bolts, nuts, U-bolts and washers for towers, infrastructure, power, railways and industrial applications."
    />
    <meta property="og:url" content="https://kaveri.agsdemo.in/" />
    <meta property="og:image" content="https://agsdemo.in/kaveri/api/assets/images/home/home_banner_image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="High Tensile MS Fasteners Manufacturer | Kaveri Industries" />
    <meta
      name="twitter:description"
      content="Kaveri Industries manufactures high tensile MS fasteners, bolts, nuts, U-bolts and washers for towers, infrastructure, power, railways and industrial applications."
    />
    <meta name="twitter:image" content="https://agsdemo.in/kaveri/api/assets/images/home/home_banner_image.webp" />

    <!-- Performance: blocking-supports-rel=preload scripts tagged with high priority
         so the React entry gets parsed ASAP. -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
