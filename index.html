<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Space Grotesk — display font for all headings. `preconnect` to
         both the CSS and font-file origins warms the TLS handshake so
         the first paint isn't blocked waiting on DNS / TCP / TLS.
         The variable-axis range 300..700 covers the full weight range
         the design uses (light, regular, medium, semibold, bold). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap"
    />

    <!-- LCP image preload — 800w is closest to the desktop display size (878px)
         and the 1200w fallback was over-fetching by 25.8 KiB. Width/height attrs
         reserve layout space up front (no CLS). -->
    <link
      rel="preload"
      as="image"
      href="/images/home/hero-fasteners-800.webp"
      imagesrcset="
        /images/home/hero-fasteners-600.webp 600w,
        /images/home/hero-fasteners-800.webp 800w,
        /images/home/hero-fasteners-1200.webp 1200w
      "
      imagesizes="(max-width: 1024px) 100vw, 50vw"
      fetchpriority="high"
    />

    <title>Kaveri Industries — High-Tensile MS Fasteners Manufacturer</title>
    <meta
      name="description"
      content="Kaveri Industries — Manufacturers of High Tensile MS Fasteners for transmission & telecommunication towers, buildings & bridges, refineries & water treatment plants, wind & power plants, railways & transportation, and road guard rail systems. An ISO 9001 Certified Company."
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaveri Industries" />
    <meta property="og:title" content="Kaveri Industries — High-Tensile MS Fasteners Manufacturer" />
    <meta
      property="og:description"
      content="Manufacturers of High Tensile MS Fasteners — hex bolts, hex nuts, studs, U-bolts, washers. An ISO 9001 Certified Company."
    />
    <meta property="og:url" content="https://kaveri-industries.example.com/" />
    <meta property="og:image" content="https://kaveri-industries.example.com/images/home/hero-fasteners-1200.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaveri Industries — High-Tensile MS Fasteners Manufacturer" />
    <meta
      name="twitter:description"
      content="Manufacturers of High Tensile MS Fasteners — hex bolts, hex nuts, studs, U-bolts, washers. An ISO 9001 Certified Company."
    />
    <meta name="twitter:image" content="https://kaveri-industries.example.com/images/home/hero-fasteners-1200.webp" />

    <!-- Performance: blocking-supports-rel=preload scripts tagged with high priority
         so the React entry gets parsed ASAP. -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
