<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/webp" href="/images/ki_logo.webp" />

    <!-- Fonts — non-blocking load so the Google Fonts stylesheet never
         delays FCP/LCP. `preload as=style` warms the CSS, the
         `media="print" onload` trick applies it async once fetched.
         `display=swap` keeps text visible with a fallback meanwhile.
         NOTE: image base URL lives in ONE place: src/lib/images.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap"
      >
    </noscript>

    <!-- Agentic Resource Discovery Manifest (ARD 1.0) -->
    <link
      rel="ai-catalog"
      href="/.well-known/ai-catalog.json"
      type="application/ai-catalog+json"
    />

    <!-- Image CDN hints — warming external CDN connection for below-fold lazy images -->
    <link rel="preconnect" href="https://kaveriindustries.com" crossorigin />
    <link rel="dns-prefetch" href="https://kaveriindustries.com" />

    <!-- LCP image preload — self-hosted local banner (zero cross-origin TLS/DNS latency)
         Mobile downloads the 15KB 768w file instead of remote 1280w variant. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/home/home_banner_image-768.webp 768w, /images/home/home_banner_image-1280.webp 1280w, /images/home/home_banner_image-1440.webp 1440w, /images/home/home_banner_image.webp 1920w"
      imagesizes="100vw"
      href="/images/home/home_banner_image-768.webp"
      fetchpriority="high"
    />

    <!-- Fallback title for dev/CSR before Helmet hydrates. The SSG prerender
         replaces this text per route (vite-prerender-plugin `head.title`);
         per-route meta/canonical/OG/Twitter are injected per route by
         src/seo/prerender.tsx, so no static data-rh SEO tags live here —
         keeping exactly one copy of each in the final head. -->
    <title>High Tensile MS Fasteners Manufacturer | Kaveri Industries</title>

    <!-- Schema.org JSON-LD — site-wide Organization + LocalBusiness + WebSite.
         Single-Page Apps must serve their site-level graph in static HTML: a
         crawler's first HTML-only wave would otherwise see zero <script
         type="application/ld+json"> tags (the "No items detected" cause).
         Organization and LocalBusiness are unified into a single canonical
         entity (@type: ["Organization", "LocalBusiness"]) to prevent duplicate
         items and missing-field warnings in Google's Rich Results Test.
         Keep in sync with src/lib/company.ts and src/lib/schemas.ts.
         Page-specific schemas (BreadcrumbList, Product, …) are injected
         client-side by the <SEO /> component per route. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "LocalBusiness"],
            "@id": "https://kaveriindustries.com/#organization",
            "name": "Kaveri Industries",
            "legalName": "Kaveri Industries",
            "url": "https://kaveriindustries.com/",
            "logo": "https://kaveriindustries.com/images/ki_logo.webp",
            "image": "https://kaveriindustries.com/images/ki_logo.webp",
            "description": "Manufacturers of High Tensile MS Fasteners for transmission & telecommunication towers, buildings & bridges, refineries & water treatment plants, wind & power plants, railways & transportation, and road guard rail systems. An ISO 9001 Certified Company.",
            "foundingDate": "2008",
            "email": "kaveriindustries4@hotmail.com",
            "telephone": "+919341443666",
            "priceRange": "₹₹",
            "sameAs": [
              "https://www.linkedin.com/company/kaveri-industries",
              "https://www.facebook.com/kaveriindustries",
              "https://twitter.com/kaveri_industries",
              "https://www.youtube.com/@kaveri-industries"
            ],
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Survey No. 485, 486 Jigani Industrial Area 2nd Phase",
              "addressLocality": "Bangalore",
              "addressRegion": "Karnataka",
              "postalCode": "560105",
              "addressCountry": "IN"
            },
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": 12.7842,
              "longitude": 77.6369
            },
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": [
                  "Monday",
                  "Tuesday",
                  "Wednesday",
                  "Thursday",
                  "Friday"
                ],
                "opens": "09:00",
                "closes": "18:00"
              },
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Saturday"],
                "opens": "09:00",
                "closes": "13:00"
              }
            ],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "sales",
                "email": "kaveriindustries4@hotmail.com",
                "telephone": "+919341443666",
                "areaServed": ["IN", "AE", "SG", "DE"],
                "availableLanguage": ["English", "Hindi"]
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://kaveriindustries.com/#website",
            "name": "Kaveri Industries",
            "url": "https://kaveriindustries.com/",
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
