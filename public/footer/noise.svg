<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!--
    Paper grain noise — fractalNoise tiles seamlessly so the footer
    reads as one continuous texture. baseFrequency=0.85 gives a fine
    grain (paper / screen-noise feel), numOctaves=2 keeps the texture
    smooth rather than busy, and the desaturate colorMatrix flattens
    the noise to grayscale so the blend mode drives the look, not the
    colour.
  -->
  <filter id="paper-noise" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-noise)"/>
</svg>
